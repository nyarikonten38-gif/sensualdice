<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dadu Sentuhan - Game Pasutri</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-dark: #c9184a;
            --bg-dark: #0f0e17;
            --card-bg: #1f1e2e;
            --accent: #ffb703;
            --text: #fffffe;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 20px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.2);
        }

        h1 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a7a9be;
            margin-bottom: 20px;
        }

        /* Container Dadu Visual */
        .dice-area {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            gap: 15px;
        }

        .dice-box {
            flex: 1;
            background: #15141e;
            border: 2px solid rgba(255, 77, 109, 0.4);
            border-radius: 16px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }

        .dice-box.shake {
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-8deg) scale(1.05); }
            40% { transform: rotate(8deg) scale(1.05); }
            60% { transform: rotate(-8deg) scale(1.05); }
            80% { transform: rotate(8deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .dice-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #a7a9be;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .dice-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
            min-height: 35px;
            display: flex;
            align-items: center;
        }

        /* Tampilan Hasil Instruksi */
        .instruction-card {
            background: #15141e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
